- hosts: jenkins
  become: yes
  vars:
    kubectl_version: "v1.29.4"
    minikube_version: "v1.33.1"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install base packages
      apt:
        name:
          - openjdk-17-jdk
          - docker.io
          - maven
          - git
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    # --- Jenkins installation (with new 2023 key) ---
    - name: Ensure Jenkins key directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins GPG key (2023)
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins apt repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Enable and start Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    # --- kubectl installation ---
    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # --- Minikube installation ---
    - name: Install Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Install dependencies for Minikube
      apt:
        name:
          - conntrack
          - socat
        state: present

    - name: Start Minikube (docker driver)
      become_user: ubuntu
      shell: |
        minikube start --driver=docker --cpus=2 --memory=4096 --kubernetes-version={{ kubectl_version | regex_replace('^v','') }}
      args:
        creates: /home/ubuntu/.minikube

    - name: Configure kubeconfig for ubuntu
      become_user: ubuntu
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp -f /home/ubuntu/.kube/config /home/ubuntu/.kube/config
      args:
        executable: /bin/bash

    - name: Copy kubeconfig to Jenkins user
      shell: |
        mkdir -p /var/lib/jenkins/.kube
        cp -f /home/ubuntu/.kube/config /var/lib/jenkins/.kube/config
        chown -R jenkins:jenkins /var/lib/jenkins/.kube

    - name: Add Jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Show Jenkins initial admin password path
      debug:
        msg: "Jenkins admin password is stored at /var/lib/jenkins/secrets/initialAdminPassword"